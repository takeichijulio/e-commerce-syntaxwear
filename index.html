<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Homepage da SyntaxWear com categorias e tênis em destaque.">
    <title>SyntaxWear - Tênis e Sneakers Online</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components/header.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <header class="header">
      <h1 class="logo">
        <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
          <img src="./assets/images/logo/Logo.svg" alt="SyntaxWear - Tênis e Sneakers Online">
        </a>
      </h1>

      <nav class="nav-center" aria-label="Categorias Pricipais">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Feminino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>

      <nav class="nav-right" aria-label="Menu complementar">
        <ul>
          <li><a href="#">Nossas lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#" aria-label="Minha conta"><img src="./assets/images/vectors/user.svg" alt=""></a></li>
          <li><a href="#" aria-label="Ajuda"><img src="./assets/images/vectors/question.svg" alt=""></a></li>
          <li><a href="#" aria-label="Sacola de compras"><img src="./assets/images/vectors/bag.svg" alt=""></a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero-section" id="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Destaque principal</h1>
      </section>

      <section class="category-section" id="categories" aria-labelledby="categories-title">
        <h2 id="categories-title">Categorias de tênis</h2>
        <ul class="category-list"></ul>
      </section>

      <section class="featured-products" id="featured-products" aria-labelledby="featured-products-title">
        <h2 id="featured-products-title">Tênis em destaque</h2>
        <ul class="product-grid"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <section class="footer-information" aria-labelledby="footer-information-title">
        <h2 id="footer-information-title">Informações</h2>
      </section>

      <section class="footer-contact" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Contato</h2>
      </section>

      <nav class="footer-navigation" aria-label="Links do rodapé">
        <h2>Links</h2>
        <ul class="footer-links">
          <li><a href="#hero">Início</a></li>
          <li><a href="#categories">Categorias</a></li>
          <li><a href="#featured-products">Destaques</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
